; Выносной пульт дозатора: ESP32-C3 SuperMini + энкодер + OLED 0.96" 128x64 (SSD1306, I2C).
; Связь с дозатором — ESP-NOW, протокол в ../../shared/RemoteProtocol.h.
;
;   pio run -t upload        # прошить пульт (USB-C SuperMini)
;   pio device monitor       # лог 115200
;
; Если порт не находится: зажать BOOT (GPIO9), нажать RESET, отпустить BOOT.

[env:supermini_c3]
platform = espressif32 @ 6.9.0          ; Arduino-ядро 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
custom_fw_name = remote
extra_scripts = pre:../../tools/fw_version.py

build_flags =
    -I ../../shared
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    olikraus/U8g2 @ ^2.35.30
